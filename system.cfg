-- Enable remote shader compilation via local Python server
r_ShadersRemoteCompiler=1
r_ShaderCompilerServer=127.0.0.1
r_VkShaderCompiler=DXC
-- Disable async shader/PSO compilation: prevents terrain sectors going black
-- while Vulkan PSOs compile on demand (the "occasionally-moving black patches" bug).
r_ShaderAsyncCompilation=0
